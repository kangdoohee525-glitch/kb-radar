<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>가격변동 레이더</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#fbfaf8;--fg:#1c2128;--mut:#6a737d;--card:#f0eeea;--line:#dedbd5;--up:#e5483f;--dn:#2f5bea}
html{scroll-padding-top:env(safe-area-inset-top,0px)}

:root[data-theme="dark"]{--bg:#14161a;--fg:#eceef1;--mut:#98a1ab;--card:#1e2126;--line:#2c3037;--up:#ff6b61;--dn:#6b8cff}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 -apple-system,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif}

.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}

.seg button:disabled{opacity:.35;cursor:not-allowed}
.mu{font-size:12px;color:var(--mut)}
button:focus-visible,input:focus-visible{outline:2px solid var(--dn);outline-offset:2px}
.card{border-top:1px solid var(--line);padding:16px 0}
.t{cursor:pointer}

.ctl{display:flex;align-items:center;gap:10px;margin-top:10px}
.ctl input{flex:1;accent-color:var(--fg)}

.st{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:10px}
.st div{background:var(--card);border-radius:10px;padding:10px}
.st small{display:block;color:var(--mut);font-size:11px}
.st b{font-size:20px;letter-spacing:-.02em}
.chip{display:inline-block;background:var(--card);border:1px solid var(--line);border-radius:99px;padding:2px 10px;margin:2px 4px 2px 0;font-size:13px}
.up{color:var(--up)}.dn{color:var(--dn)}
.n{font-size:12px;color:var(--mut);margin-top:12px}
.lg{display:flex;justify-content:space-between;font-size:11px;color:var(--mut);margin-top:6px}
#pop{position:fixed;left:0;right:0;bottom:0;display:none;justify-content:center;padding:0 12px calc(12px + env(safe-area-inset-bottom,0px));pointer-events:none}
#pop.on{display:flex}
#pop>div{pointer-events:auto;width:100%;max-width:360px;background:var(--bg);color:var(--fg);border:1px solid var(--line);border-radius:14px;padding:12px 16px;box-shadow:0 8px 28px rgba(0,0,0,.2)}
#pop h3{margin:0 0 6px;font-size:15px;display:flex;justify-content:space-between;align-items:center}
#pop h3 button{font:inherit;border:0;background:none;color:var(--mut);font-size:20px;line-height:1;cursor:pointer;padding:0 4px}
#pop p{margin:2px 0;font-size:14px}
</style></head><body><main>
<h1>가격변동 레이더 <span class="b" id="bd">샘플 데이터</span></h1>
<p class="s">지수와 변동률이 얼마나 움직이는지, 상승세가 어느 동네까지 퍼졌는지 한눈에 봅니다.</p>
<div class="row"><div class="seg" id="gm"></div><div class="seg" id="gk"></div><div class="seg" id="gv"></div></div>
<div class="row" style="margin-bottom:4px"><div class="seg" id="gw"></div></div><p class="s" id="hint"></p>
<section><h2 id="mt"></h2><div id="map"></div>
<div class="lg" id="lgd"></div>
<div class="ctl"><button class="pb" id="pl">▶ 재생</button><input type="range" id="sl" aria-label="기준 시점"></div></section>
<section class="card"><h2>상승세 확산</h2><div id="sp"></div></section>
<section class="card"><h2 id="ct"></h2><div id="ch"></div></section>
<p class="n">타일을 누르면 해당 지역의 지수 그래프를 볼 수 있어요. 지도는 실제 면적이 아닌 위치 기준 배열입니다. 데이터는 KB부동산 데이터허브 주간 아파트 가격지수이며 매주 금요일 갱신됩니다. data.json이 없으면 샘플 데이터로 표시돼요.</p>
</main><div id="pop" role="dialog" aria-live="polite"></div>
<script>
let T=156,END=new Date(2026,8,28),REAL=null;const $=s=>document.querySelector(s);
const P={
서울:{o:[4,3],k:4,s:"도봉3,0 노원4,0 은평1,1 강북2,1 성북3,1 중랑4,1 서대문1,2 종로2,2 동대문3,2 성동4,2 광진5,2 마포1,3 중구2,3 용산3,3 강남4,3 송파5,3 강동6,3 강서0,4 양천1,4 영등포2,4 동작3,4 서초4,4 구로1,5 금천2,5 관악3,5"},
경기:{o:[3,3.5],k:5,s:"연천3,0 파주1,1 양주2,1 동두천3,1 포천4,1 김포0,2 고양1,2 의정부2,2 구리3,2 남양주4,2 가평5,2 부천1,3 광명2,3 과천3,3 하남4,3 양평5,3 시흥1,4 안양2,4 성남3,4 광주4,4 이천5,4 안산0,5 군포1,5 의왕2,5 수원3,5 용인4,5 여주5,5 화성2,6 오산3,6 안성5,6 평택3,7"}};
for(const m in P){const g=P[m];g.R=g.s.split(' ').map(x=>{const a=x.match(/^(\D+)(\d),(\d)$/);return{n:a[1],c:+a[2],r:+a[3]}});g.W=Math.max(...g.R.map(r=>r.c))+1;g.H=Math.max(...g.R.map(r=>r.r))+1}
const rnd=a=>()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296};
const C={};
// 데이터 연결 지점: 지역별 주간 지수 배열(길이 T+1, 시작=100)을 반환. 실제 데이터로 교체하세요.
function data(m,k){const key=m+k;if(C[key])return C[key];const g=P[m],f=rnd(m.charCodeAt(0)*7+k*131+1);
if(REAL)return C[key]=g.R.map(r=>REAL[m][k][r.n]);return C[key]=g.R.map(r=>{const d=Math.hypot(r.c-g.o[0],r.r-g.o[1]),lag=d*g.k-(k?8:0),amp=(.25+.45*f())*Math.max(.2,1.25-d*.13)*(k?.85:1),dn=.06+.1*f(),x=[100];
for(let t=1;t<=T;t++){const sg=1/(1+Math.exp(-(t-82-lag)/13));x.push(x[t-1]*(1+(amp*sg-dn*(1-sg)+(f()-.5)*.1)/100))}return x})}
const chg=(x,e,w)=>(x[e]/x[e-w]-1)*100,TH=w=>w*.058,wd=()=>[[13,'3개월'],[26,'6개월'],[52,'1년'],[156,'3년'],[364,'7년']].map(o=>[o[0],o[1],o[0]>T]);
const dt=t=>{const d=new Date(END-(T-t)*6048e5);return`${String(d.getFullYear()).slice(2)}.${d.getMonth()+1}.${d.getDate()}`};
const pc=v=>(v>0?'+':'')+v.toFixed(1)+'%';
const S={m:'서울',k:0,w:13,v:'chg',e:T,sel:null,id:0};
function seg(id,o,cur){$('#'+id).innerHTML=o.map(([v,l,d])=>`<button data-g="${id}" data-v="${v}" ${d?'disabled':''} class="${v==cur?'on':''}">${l}</button>`).join('')}
function col(v,mx){const a=Math.min(1,Math.abs(v)/mx);if(Math.abs(v)<mx*.04)return['var(--card)','var(--fg)'];return[v>0?`rgba(229,72,63,${.2+.8*a})`:`rgba(47,91,234,${.2+.8*a})`,a>.55?'#fff':'var(--fg)']}
function render(){
 const WD=wd(),AV=WD.filter(o=>!o[2]);if(!AV.some(o=>o[0]==S.w))S.w=(AV.find(o=>o[0]==52)||AV[AV.length-1])[0];
 $('#hint').textContent=AV.length<WD.length?`받아온 데이터가 ${T}주(약 ${(T/52).toFixed(1)}년)치라 ${WD.filter(o=>o[2]).map(o=>o[1]).join('·')}은 아직 볼 수 없어요.`:'';S.e=Math.max(S.w,Math.min(S.e,T));sl.min=S.w;sl.max=T;sl.value=S.e;sl.disabled=$('#pl').disabled=T<=S.w;
 const g=P[S.m],X=data(S.m,S.k),w=S.w,e=S.e,L=Math.max(4,Math.round(w/4)),v=X.map(x=>chg(x,e,w)),mx=Math.max(.3,...v.map(Math.abs));
 seg('gm',[['서울','서울'],['경기','경기']],S.m);seg('gk',[[0,'매매'],[1,'전세']],S.k);seg('gw',WD,w);seg('gv',[['chg','변동률'],['on','상승 시작 시점']],S.v);
 $('#mt').textContent=S.v=='on'?`${dt(e)} 기준 · 현재 상승세가 시작된 시점(${S.k?'전세':'매매'})`:`${dt(e-w)} → ${dt(e)} ${S.k?'전세':'매매'} 변동률`;
 $('#lgd').innerHTML=S.v=='on'?'<span class="up">◀ 먼저 오른 곳</span><span>회색: 상승 아님</span><span>최근 오른 곳 ▶</span>':'<span class="dn">◀ 하락</span><span>보합</span><span class="up">상승 ▶</span>';
 const K=13,tk=TH(K),on=X.map(x=>{if(chg(x,e,K)<=tk)return null;let t=e;while(t>K&&chg(x,t-1,K)>tk)t--;return t});
 const ov=on.filter(t=>t!=null),o0=Math.min(...ov),o1=Math.max(...ov);
 const ocol=i=>{const t=on[i];if(t==null)return['var(--card)','var(--mut)'];const a=o1>o0?(t-o0)/(o1-o0):0;return[`rgba(229,72,63,${(1-.75*a).toFixed(2)})`,a<.55?'#fff':'var(--fg)']};
 const otx=i=>on[i]==null?'–':on[i]<=K?'이전부터':ym(on[i]);
 const cw=64,ch=50;
 $('#map').innerHTML=`<svg viewBox="0 0 ${g.W*cw} ${g.H*ch}" role="img" aria-label="지역별 변동률 지도">`+g.R.map((r,i)=>{const[f,tc]=S.v=='on'?ocol(i):col(v[i],mx);
  return`<g class="t" data-i="${i}" transform="translate(${r.c*cw},${r.r*ch})"><rect x="2" y="2" width="${cw-4}" height="${ch-4}" rx="7" fill="${f}" stroke="${S.sel===i?'var(--fg)':'none'}" stroke-width="2.5"/><text x="${cw/2}" y="${ch/2-2}" text-anchor="middle" font-size="12" font-weight="600" fill="${tc}">${r.n}</text><text x="${cw/2}" y="${ch/2+13}" text-anchor="middle" font-size="11" fill="${tc}">${S.v=='on'?otx(i):pc(v[i])}</text></g>`}).join('')+'</svg>';
 // 확산
 const ratio=t=>X.filter(x=>chg(x,t,w)>TH(w)).length/X.length*100,rs=[];for(let t=w;t<=T;t++)rs.push(ratio(t));
 const cur=ratio(e),ok=e-L>=w,sp=ok?cur-ratio(e-L):0,avg=v.reduce((a,b)=>a+b,0)/v.length;
 const nw=ok?g.R.filter((r,i)=>chg(X[i],e,w)>TH(w)&&chg(X[i],e-L,w)<=TH(w)).map(r=>r.n):[];
 const lab=!ok?'비교 구간 부족':sp>=10?'빠르게 확산 중':sp>=3?'완만히 확산 중':sp>-3?'확산 정체':'상승세 위축';
 const px=t=>4+332*(t-w)/Math.max(1,T-w),py=r=>64-58*r/100;
 const pts=g.R.map((r,i)=>({c:r.c,r:r.r,t:on[i]})).filter(p=>p.t!=null&&p.t>K);let hd=null,cp='',pm=0;
 if(pts.length>=5){const n=pts.length,mc=pts.reduce((a,p)=>a+p.c,0)/n,mr=pts.reduce((a,p)=>a+p.r,0)/n,mt=pts.reduce((a,p)=>a+p.t,0)/n;let sxx=0,syy=0,sxy=0,sxt=0,syt=0,stt=0;
  for(const p of pts){const dx=p.c-mc,dy=p.r-mr,dz=p.t-mt;sxx+=dx*dx;syy+=dy*dy;sxy+=dx*dy;sxt+=dx*dz;syt+=dy*dz;stt+=dz*dz}
  const det=sxx*syy-sxy*sxy;
  if(det>1e-6&&stt>0){const bx=(sxt*syy-syt*sxy)/det,by=(syt*sxx-sxt*sxy)/det,r2=(bx*sxt+by*syt)/stt;pm=Math.hypot(bx,by);
   if(r2>=.15&&pm>.5){hd=(Math.atan2(bx,-by)*180/Math.PI+360)%360;cp=['북','북동','동','남동','남','남서','서','북서'][Math.round(hd/45)%8]}}}
 const so=g.R.map((r,i)=>[r.n,on[i]]).filter(a=>a[1]!=null).sort((a,b)=>a[1]-b[1]),h3=a=>a.slice(0,3).map(x=>x[0]).join('·')||'–';
 const dirH=`<div style="display:flex;gap:12px;align-items:center;margin-bottom:12px"><svg viewBox="-22 -22 44 44" style="width:44px;height:44px;flex:none"><circle r="21" fill="var(--card)"/>${hd==null?'':`<g transform="rotate(${hd.toFixed(0)})"><path d="M0 -15L7 5L0 1L-7 5Z" fill="var(--up)"/></g>`}</svg><div><b>${hd==null?'뚜렷한 확산 방향이 아직 없어요':`상승세가 ${cp}쪽으로 번지는 중`}</b><div class="mu">가장 먼저 ${h3(so)} → 최근 ${h3(so.slice().reverse().filter(a=>a[1]>K))}${hd==null?'':` · 옆 지역으로 번지는 데 평균 약 ${Math.round(pm)}주`}</div></div></div>`;
 $('#sp').innerHTML=dirH+`<div class="st"><div><small>평균 변동률</small><b class="${avg>=0?'up':'dn'}">${pc(avg)}</b></div><div><small>상승 지역 비율</small><b>${cur.toFixed(0)}%</b></div><div><small>확산 속도(최근 ${L}주)</small><b class="${sp>=0?'up':'dn'}">${ok?(sp>0?'+':'')+sp.toFixed(0)+'%p':'–'}</b></div></div>
 <p style="margin:0 0 6px"><b>${lab}.</b> ${ok?`최근 ${L}주 새 ${nw.length?'상승 전환한 지역':'새로 상승 전환한 지역은 없어요'}`:'기준 시점을 더 최근으로 옮기면 확산 속도를 볼 수 있어요.'}</p>${nw.map(n=>`<span class="chip">${n}</span>`).join('')}
 <svg viewBox="0 0 340 70" style="margin-top:8px" role="img" aria-label="상승 지역 비율 추이"><line x1="4" x2="336" y1="64" y2="64" stroke="var(--line)"/><polyline fill="none" stroke="var(--fg)" stroke-width="2" points="${rs.map((r,i)=>px(w+i).toFixed(1)+','+py(r).toFixed(1)).join(' ')}"/><circle cx="${px(e)}" cy="${py(cur)}" r="4" fill="var(--up)"/></svg>
 <div class="lg"><span>${dt(w)}</span><span>상승 지역 비율 추이</span><span>${dt(T)}</span></div>`;
 main();pop()}
const ym=t=>{const d=new Date(END-(T-t)*6048e5);return`${String(d.getFullYear()).slice(2)}.${d.getMonth()+1}`};
const full=(n,m)=>m=='서울'?(n=='중구'?n:n+'구'):n+('연천가평양평'.includes(n)?'군':'시');
const fd=t=>{const d=new Date(END-(T-t)*6048e5);return`${d.getFullYear()}년 ${d.getMonth()+1}월 ${d.getDate()}일`};
function pop(){const el=$('#pop');if(S.pop==null){el.className='';el.innerHTML='';return}
 const x=data(S.m,S.k)[S.pop],e=S.e,w=S.w,c=chg(x,e,w);
 el.className='on';el.innerHTML=`<div><h3><span>${full(P[S.m].R[S.pop].n,S.m)} ${S.k?'전세':'매매'}</span><button data-x aria-label="닫기">×</button></h3><p>${fd(e-w)} : ${x[e-w].toFixed(1)}</p><p>${fd(e)} : ${x[e].toFixed(1)}</p><p>변동률 : <b class="${c>=0?'up':'dn'}">${pc(c)}</b></p></div>`}
function main(){
 const g=P[S.m],A=[0,1].map(k=>{const D=data(S.m,k);return S.sel==null?D[0].map((_,t)=>D.reduce((s,x)=>s+x[t],0)/D.length):D[S.sel]});
 $('#ct').textContent=`${S.sel==null?S.m+' 평균':g.R[S.sel].n} 지수와 주간 변동률`;
 const W=340,L=34,R=8,all=A[0].concat(A[1]),lo=Math.min(...all),hi=Math.max(...all),X=t=>L+(W-L-R)*t/T,Y=q=>10+100*(1-(q-lo)/(hi-lo));
 const pl=a=>a.map((q,t)=>X(t).toFixed(1)+','+Y(q).toFixed(1)).join(' '),a=A[S.k],rt=a.map((q,t)=>t?(q/a[t-1]-1)*100:0),mr=Math.max(.2,...rt.map(Math.abs)),bw=Math.max(.4,(W-L-R)/T);
 const bars=rt.map((r,t)=>t?`<rect x="${(X(t)-bw/2).toFixed(1)}" y="${r>0?148-r/mr*26:148}" width="${bw.toFixed(2)}" height="${(Math.abs(r)/mr*26).toFixed(1)}" fill="${r>0?'var(--up)':'var(--dn)'}" opacity=".7"/>`:'').join('');
 const gl=[lo,(lo+hi)/2,hi].map(q=>`<line x1="${L}" x2="${W-R}" y1="${Y(q)}" y2="${Y(q)}" stroke="var(--line)"/><text x="${L-4}" y="${Y(q)+4}" text-anchor="end" font-size="10" fill="var(--mut)">${q.toFixed(0)}</text>`).join('');
 const xl=[0,Math.round(T/3),Math.round(2*T/3),T].map(t=>`<text x="${X(t)}" y="188" text-anchor="${t?t==T?'end':'middle':'start'}" font-size="10" fill="var(--mut)">${dt(t)}</text>`).join('');
 $('#ch').innerHTML=`<svg viewBox="0 0 340 192" role="img" aria-label="지수 및 변동률 그래프">${gl}<line x1="${L}" x2="${W-R}" y1="148" y2="148" stroke="var(--line)"/>${bars}<polyline fill="none" stroke="var(--dn)" stroke-width="2" points="${pl(A[0])}"/><polyline fill="none" stroke="var(--up)" stroke-width="2" points="${pl(A[1])}"/><line x1="${X(S.e)}" x2="${X(S.e)}" y1="10" y2="174" stroke="var(--fg)" stroke-dasharray="3 3"/>${xl}</svg>
 <div class="lg"><span><b class="dn">━</b> 매매지수 · <b class="up">━</b> 전세지수</span><span>아래 막대: ${S.k?'전세':'매매'} 주간 변동률</span></div>`}
document.addEventListener('click',ev=>{const b=ev.target.closest('button[data-g]'),t=ev.target.closest('.t');
 if(b){const g=b.dataset.g,v=b.dataset.v;if(g=='gm'){S.m=v;S.sel=null;S.pop=null}if(g=='gk')S.k=+v;if(g=='gw')S.w=+v;if(g=='gv')S.v=v;render()}
 else if(ev.target.closest('[data-x]')){S.pop=null;pop()}
 else if(t){const i=+t.dataset.i;S.sel=S.sel===i?null:i;S.pop=S.sel;render()}});
document.addEventListener('keydown',ev=>{if(ev.key=='Escape'){S.pop=null;pop()}});
